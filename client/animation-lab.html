<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蜥蜴动画教学实验室</title>
  <link rel="stylesheet" href="css/animation-lab.css">
</head>
<body>
  <!-- 全屏演示画布 -->
  <canvas id="labCanvas"></canvas>

  <!-- 屏幕正中的提示词板：每环节先显示，按空格后隐藏并播放动画 -->
  <aside class="stage-card" id="card" hidden>
    <div class="card-title" id="cardTitle">—</div>
    <p class="card-prompt" id="cardPrompt">—</p>
  </aside>

  <!-- 左下角悬浮参数面板（仅第12步） -->
  <div class="param-panel" id="paramPanel" hidden>
    <h3>参数化</h3>
    <label>体型 <input type="range" id="pBodyScale" min="0.6" max="1.6" step="0.05" value="1"></label>
    <label>头部 <input type="range" id="pHeadScale" min="0.6" max="1.8" step="0.05" value="1"></label>
    <label>肢体粗细 <input type="range" id="pLimb" min="0.5" max="2" step="0.05" value="1"></label>
    <label>身体色相 <input type="range" id="pHue" min="0" max="360" step="1" value="120"></label>
    <label>花纹
      <select id="pPattern">
        <option value="spots">斑点</option>
        <option value="stripes">条纹</option>
        <option value="none">无</option>
      </select>
    </label>
    <label>脊椎节数 <input type="range" id="pNodes" min="8" max="26" step="1" value="20"></label>
  </div>

  <!-- 左下角悬浮蛇形波调节面板（仅第7步） -->
  <div class="param-panel" id="serpPanel" hidden>
    <h3>蛇形波调节</h3>
    <label>波幅 <span class="pv" id="vSerpAmp">1.0</span>
      <input type="range" id="pSerpAmp" min="0" max="14" step="0.5" value="1.0"></label>
    <label>频率 <span class="pv" id="vSerpFreq">0.75</span>
      <input type="range" id="pSerpFreq" min="0.05" max="0.9" step="0.05" value="0.75"></label>
    <label>速度 <span class="pv" id="vSerpSpeed">0.15</span>
      <input type="range" id="pSerpSpeed" min="0.05" max="1.2" step="0.05" value="0.15"></label>
    <div class="panel-hint">拖动滑块调出最佳波动；牵引蜥蜴移动可观察效果</div>
  </div>

  <!-- 底部悬浮工具条：标题 / 时间轴 / 控制 -->
  <div id="topbar">
    <div class="tb-left">
      <span class="tb-title">🦎 蜥蜴动画教学实验室</span>
    </div>
    <div class="tb-timeline" id="timeline"></div>
    <div class="tb-controls">
      <label class="tb-switch" title="开启后蜥蜴会自动缓慢漫游；关闭则原地待命，仅响应鼠标牵引/放置食物">
        <input type="checkbox" id="chkAuto" checked> 自动游走
      </label>
      <button id="btnPrev" title="上一步">⏮</button>
      <button id="btnNext" title="下一步">⏭</button>
      <button id="btnPlay">⏸ 暂停动画</button>
      <select id="selSpeed" title="速度">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
      </select>
      <button id="btnAuto">⏩ 自动演进</button>
    </div>
  </div>

  <script src="js/teaching/teaching-math.js"></script>
  <script src="js/teaching/sample-creature.js"></script>
  <script src="js/teaching/teaching-stages.js"></script>
  <script src="js/teaching/teaching-renderer.js"></script>
  <script src="js/animation-lab.js"></script>
</body>
</html>
